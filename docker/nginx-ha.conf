worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ip_hash pins each client IP to one replica for MCP's persistent sessions
  # (Streamable HTTP / stdio-bridge long-lived connections, and the Session
  # Channel /watch, /stream endpoints) - the same trade-off as the Helm
  # chart's Service-level sessionAffinity: ClientIP (see docs/KUBERNETES.md):
  # clients sharing one NAT'd/proxied IP collapse onto a single replica.
  # Stock nginx has no cookie-based stickiness without a third-party module
  # or nginx-plus, so this is the portable, zero-extra-build option - kept
  # consistent with the Helm chart's own choice rather than introducing a
  # different affinity mechanism per deployment target.
  upstream mcp_depot_backend {
    ip_hash;
    server server-1:3000 max_fails=3 fail_timeout=10s;
    server server-2:3000 max_fails=3 fail_timeout=10s;
    server server-3:3000 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;

    location /health {
      access_log off;
      proxy_pass http://mcp_depot_backend;
    }

    location / {
      proxy_pass http://mcp_depot_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection '';
      # Streamable HTTP / SSE responses are long-lived - buffering would
      # delay delivery until nginx's buffer fills or the upstream closes.
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
